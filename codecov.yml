# Coverage policy (decided 2026-10-30): the project status fails when total
# coverage falls below 90%, whatever the base commit had; above that line a
# small dip from one PR is allowed. The patch status reports what new code
# left uncovered without blocking.
coverage:
  status:
    project:
      default:
        target: 90%
        threshold: 1%
    patch:
      default:
        informational: true

[workspace]
members = ["cargo:."]

# Config for 'dist' (cargo-dist): how sbt-server is built and released.
# `dist init` and `dist generate` keep .github/workflows/release.yml in sync
# with this file; edit here, then run `dist generate`.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app: a `curl | sh` script attached to
# each release, and a Homebrew formula pushed to the tap below.
installers = ["shell", "homebrew"]
# `brew install scottweaver/tap/sbt-server`
tap = "scottweaver/homebrew-tap"
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax). macOS is
# the supported platform; the Linux archive ships because CI proves it and
# Linux support comes later; Windows is out of scope for good.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# On pull requests only plan the release; build nothing.
pr-run-mode = "plan"
# Embed each binary's dependency list so `cargo audit bin` can audit an
# installed sbtctl or sbtd.
cargo-auditable = true
# Attach a CycloneDX SBOM per package to the release for security intake.
cargo-cyclonedx = true
# Sign each platform archive with a GitHub artifact attestation so
# `gh attestation verify <archive> --owner scottweaver` proves it came from
# this repository's release workflow. Experimental in cargo-dist 0.32.
github-attestations = true

# GitHub deprecated the macos-14 image (actions/runner-images#13518):
# brownouts cancel jobs on it until it is retired on 2026-11-02, and dist
# 0.32 still picks it for Apple Silicon. Intel macOS already gets macos-15.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"

# Pin the GitHub-owned actions release.yml uses to full commit SHAs instead
# of mutable tags (OpenSSF Scorecard Pinned-Dependencies). release.yml is
# generated, so this table is the only place to change a pin; Dependabot
# PRs that edit release.yml directly fail `dist plan` and are closed.
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2

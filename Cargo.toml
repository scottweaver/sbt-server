[workspace]
resolver = "3"
members = [
    "crates/cli",
    "crates/core",
    "crates/daemon",
    "crates/fake-sbt",
    "crates/sbt-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/scottweaver/sbt-server"
homepage = "https://github.com/scottweaver/sbt-server"
authors = ["Scott T Weaver"]

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
clap = { version = "4.5", features = ["derive", "env"] }
nix = { version = "0.31", default-features = false, features = ["process", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53", default-features = false }
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

fake-sbt = { path = "crates/fake-sbt" }
sbt-server-cli = { path = "crates/cli" }
sbt-server-core = { path = "crates/core" }
sbt-server-daemon = { path = "crates/daemon" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

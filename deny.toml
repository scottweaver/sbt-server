# cargo-deny policy: `cargo deny check` runs locally and as the `deny` job in CI.
# A new advisory failing every PR is the intended behaviour; fix it with a
# bump or an `ignore` entry that carries a written reason.

[advisories]
yanked = "deny"
unmaintained = "all"
ignore = []

[licenses]
# Derived from `cargo deny list` on the real tree; add a license only when a
# dependency actually needs it.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version; they only point at the
# unpublished crates, which is the one case this permits.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

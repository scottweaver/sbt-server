[package]
name = "sbt-server-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
sbt-server-core = { path = "../crates/core" }
sbt-server-daemon = { path = "../crates/daemon" }

[[bin]]
name = "host_header"
path = "fuzz_targets/host_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "framing"
path = "fuzz_targets/framing.rs"
test = false
doc = false
bench = false

[[bin]]
name = "message"
path = "fuzz_targets/message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "descriptor"
path = "fuzz_targets/descriptor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lines"
path = "fuzz_targets/lines.rs"
test = false
doc = false
bench = false

[workspace]
